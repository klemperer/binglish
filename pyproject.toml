[project]
name = "binglish"
version = "2.0.0"
description = "Bing wallpaper + passive English learning tray app (modular rewrite)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "requests>=2.31",
  "pystray>=0.19",
  "Pillow>=10.0",
  "playsound3>=2.0",
  "ExifRead>=3.0",
  "qrcode>=7.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.4",
]
mac = [
  "tkmacosx>=0.5",
]

[project.scripts]
binglish = "binglish.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["binglish*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = [
  "BLE001",  # broad Exception at OS/network/UI boundaries is intentional
  "S101",    # assert in tests
  "S110",    # try-except-pass on DPI/beep/window teardown
  "S112",
  "S311",    # random.choice for quotes/hints, not crypto
  "S603",    # fixed argv subprocess (osascript/cmd/open)
  "S606",    # os.startfile
  "S607",    # partial executable path on PATH (clip, ioreg, afplay)
  "SIM102",
  "SIM103",
  "SIM105",  # contextlib.suppress optional style
  "B905",    # zip strict on py3.10 optional
  "DTZ005",  # local wall-clock for history / filenames
  "E501",    # long bilingual quote strings
  "E731",    # lambda assignment in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
