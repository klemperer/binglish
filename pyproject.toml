[project]
name = "binglish"
version = "2.0.0"
description = "Bing wallpaper + passive English learning tray app (modular rewrite)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "requests>=2.31",
  "pystray>=0.19",
  "Pillow>=10.0",
  "playsound3>=2.0",
  "ExifRead>=3.0",
  "qrcode>=7.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.4",
]
mac = [
  "tkmacosx>=0.5",
]

[project.scripts]
binglish = "binglish.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["binglish*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
